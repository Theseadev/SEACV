<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      /* Ciri khas teknik sirang / jelujur: garis putus-putus titik jelujur */
      .s-stitch { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-dasharray: 2.5, 3.5; stroke-linecap: round; }
      .s-stitch-fine { fill: none; stroke: #ffffff; stroke-width: 1.4; stroke-dasharray: 2, 3; stroke-linecap: round; }
      .s-solid { fill: none; stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .s-dot { fill: #ffffff; }
      .s-teeth { fill: rgba(255, 255, 255, 0.25); stroke: #ffffff; stroke-width: 1.4; stroke-linejoin: round; stroke-dasharray: 3, 2.5; }
    </style>
  </defs>

  <g opacity="0.88">
    <!-- ========================================================== -->
    <!-- MOTIF GIGI HARUAN (Gerigi Ikan Gabus khas Banjar) DIAGONAL -->
    <!-- ========================================================== -->
    <!-- Garis Utama Gigi Haruan Diagonal dari (0, 0) ke (160, 160) -->
    <path class="s-teeth" d="
      M -20,-20 
      L -10,-10 L -5,-18 L 10,2 L 15,-6 L 30,14 L 35,6 L 50,26 L 55,18 
      L 70,38 L 75,30 L 90,50 L 95,42 L 110,62 L 115,54 L 130,74 L 135,66 
      L 150,86 L 155,78 L 170,98 L 175,90 L 190,110
    " />
    
    <!-- Garis Jalur Jelujur Sejajar (Jahit Sirang) -->
    <path class="s-stitch" d="M -20,-8 L 180,192" />
    <path class="s-stitch-fine" d="M -20,-3 L 180,197" />

    <!-- Gigi Haruan Pasangan Kedua (Offset untuk Tiling) -->
    <path class="s-teeth" d="
      M -20,140 
      L -10,150 L -5,142 L 10,162 L 15,154 L 30,174 L 35,166 L 50,186
    " />
    <path class="s-teeth" d="
      M 140,-20 
      L 150,-10 L 155,-18 L 170,2 L 175,-6 L 190,14
    " />

    <!-- ========================================================== -->
    <!-- MOTIF KANGKUNG KAOMBAKAN (Sulur Ombak Melengkung khas Banjar) -->
    <!-- ========================================================== -->
    <path class="s-stitch" d="M -20,60 C 20,40 40,80 80,60 C 120,40 140,80 180,60" />
    <path class="s-stitch-fine" d="M -20,66 C 20,46 40,86 80,66 C 120,46 140,86 180,66" />
    
    <path class="s-stitch" d="M -20,140 C 20,120 40,160 80,140 C 120,120 140,160 180,140" />
    <path class="s-stitch-fine" d="M -20,146 C 20,126 40,166 80,146 C 120,126 140,166 180,146" />

    <!-- ========================================================== -->
    <!-- MOTIF HIRIS GAGATAS (Belah Ketupat / Wajik khas Sasirangan) -->
    <!-- ========================================================== -->
    <!-- Wajik 1 (Center-Left) -->
    <g transform="translate(45, 105)">
      <polygon class="s-stitch" points="0,-16 16,0 0,16 -16,0" />
      <polygon class="s-stitch-fine" points="0,-10 10,0 0,10 -10,0" />
      <circle class="s-dot" cx="0" cy="0" r="3" />
      <circle class="s-dot" cx="0" cy="-21" r="1.8" />
      <circle class="s-dot" cx="21" cy="0" r="1.8" />
      <circle class="s-dot" cx="0" cy="21" r="1.8" />
      <circle class="s-dot" cx="-21" cy="0" r="1.8" />
    </g>

    <!-- Wajik 2 (Top-Right) -->
    <g transform="translate(125, 25)">
      <polygon class="s-stitch" points="0,-16 16,0 0,16 -16,0" />
      <polygon class="s-stitch-fine" points="0,-10 10,0 0,10 -10,0" />
      <circle class="s-dot" cx="0" cy="0" r="3" />
      <circle class="s-dot" cx="0" cy="-21" r="1.8" />
      <circle class="s-dot" cx="21" cy="0" r="1.8" />
      <circle class="s-dot" cx="0" cy="21" r="1.8" />
      <circle class="s-dot" cx="-21" cy="0" r="1.8" />
    </g>

    <!-- ========================================================== -->
    <!-- MOTIF BINTANG BAHAMBUR (Bintang bertaburan khas Banjar)    -->
    <!-- ========================================================== -->
    <!-- Ornamen Bintang & Titik Jelujur -->
    <g transform="translate(115, 115)">
      <circle class="s-dot" cx="0" cy="0" r="3.2" />
      <circle class="s-stitch-fine" cx="0" cy="0" r="9" />
      <circle class="s-dot" cx="0" cy="-14" r="1.6" />
      <circle class="s-dot" cx="14" cy="0" r="1.6" />
      <circle class="s-dot" cx="0" cy="14" r="1.6" />
      <circle class="s-dot" cx="-14" cy="0" r="1.6" />
    </g>

    <g transform="translate(35, 35)">
      <circle class="s-dot" cx="0" cy="0" r="3.2" />
      <circle class="s-stitch-fine" cx="0" cy="0" r="9" />
      <circle class="s-dot" cx="0" cy="-14" r="1.6" />
      <circle class="s-dot" cx="14" cy="0" r="1.6" />
      <circle class="s-dot" cx="0" cy="14" r="1.6" />
      <circle class="s-dot" cx="-14" cy="0" r="1.6" />
    </g>

    <!-- Titik Jelujur Tabur (Cecek Sasirangan) -->
    <circle class="s-dot" cx="80" cy="15" r="2.2" />
    <circle class="s-dot" cx="80" cy="105" r="2.2" />
    <circle class="s-dot" cx="150" cy="75" r="2.2" />
    <circle class="s-dot" cx="10" cy="85" r="2.2" />
  </g>
</svg>
