<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_syarat-berkas-lamaran.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181308" />
      <stop offset="60%" stop-color="#3d2b0e" />
      <stop offset="100%" stop-color="#181308" />
    </linearGradient>
    <filter id="glow_syarat-berkas-lamaran.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid_syarat-berkas-lamaran.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad_syarat-berkas-lamaran.svg)" />
  <rect width="800" height="450" fill="url(#grid_syarat-berkas-lamaran.svg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="700" cy="100" r="180" fill="#fbbf24" opacity="0.12" filter="url(#glow_syarat-berkas-lamaran.svg)" />
  <circle cx="100" cy="380" r="160" fill="#fbbf24" opacity="0.08" filter="url(#glow_syarat-berkas-lamaran.svg)" />

  <!-- Illustration Graphic on the Right -->
  <g transform="translate(520, 100)">
    <!-- Main Decorative Card / Backdrop -->
    <rect x="0" y="20" width="220" height="260" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="15" y="0" width="220" height="260" rx="18" fill="rgba(255,255,255,0.09)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Graphic Elements inside Card -->
    <circle cx="65" cy="50" r="22" fill="#fbbf24" opacity="0.25" />
    <circle cx="65" cy="50" r="10" fill="#fbbf24" />
    
    <rect x="100" y="42" width="105" height="8" rx="4" fill="#ffffff" opacity="0.85" />
    <rect x="100" y="56" width="70" height="6" rx="3" fill="#94a3b8" opacity="0.6" />
    
    <line x1="35" y1="88" x2="215" y2="88" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Skeleton Lines / Bars -->
    <rect x="35" y="105" width="160" height="7" rx="3.5" fill="#ffffff" opacity="0.4" />
    <rect x="35" y="122" width="180" height="7" rx="3.5" fill="#ffffff" opacity="0.25" />
    <rect x="35" y="139" width="130" height="7" rx="3.5" fill="#ffffff" opacity="0.25" />

    <rect x="35" y="165" width="80" height="26" rx="8" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="75" y="182" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VERIFIED</text>

    <!-- Floating Mini Badge -->
    <g transform="translate(-35, 170)">
      <rect width="110" height="52" rx="14" fill="#0b132b" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow_syarat-berkas-lamaran.svg)" />
      <circle cx="28" cy="26" r="14" fill="#fbbf24" opacity="0.2" />
      <path d="M 23 26 L 27 30 L 33 22" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SeaCV</text>
      <text x="50" y="37" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Career Hub</text>
    </g>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 105)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="#fbbf24" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#fbbf24" />
    <text x="32" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.08em">CHECKLIST DOKUMEN</text>

    <!-- Main Title -->
    <text x="0" y="82" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">
      Syarat Berkas Lamaran Kerja
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Daftar Dokumen Wajib &amp; Susunan Standar Rekruter
    </text>

    <!-- Meta Read Time & Author -->
    <g transform="translate(0, 175)">
      <!-- Clock Icon -->
      <circle cx="10" cy="10" r="9" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <polyline points="10 5 10 10 13 12" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
      <text x="28" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">4 Menit Baca</text>

      <!-- Dot Separator -->
      <circle cx="120" cy="10" r="2.5" fill="#64748b" />

      <!-- Verified Shield -->
      <path d="M 136 4 L 146 1 L 156 4 L 156 10 C 156 16 146 19 146 19 C 146 19 136 16 136 10 Z" fill="none" stroke="#fbbf24" stroke-width="1.8" />
      <text x="166" y="14" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Team SeaCV</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="445" width="800" height="5" fill="#fbbf24" />
</svg>